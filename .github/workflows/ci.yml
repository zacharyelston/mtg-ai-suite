name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Rust checks (includes WASM build)
  # ============================================
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build release
        run: cargo build --release

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: wasm-pack build crates/mtg-wasm --target web

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/mtg-wasm/pkg/

  # ============================================
  # TypeScript checks (only if client exists)
  # ============================================
  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if client exists
        id: check_client
        run: |
          if [ -d "client" ] && [ -f "client/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_client.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: steps.check_client.outputs.exists == 'true'
        working-directory: ./client
        run: npm ci

      - name: Type check
        if: steps.check_client.outputs.exists == 'true'
        working-directory: ./client
        run: npm run type-check

      - name: Lint
        if: steps.check_client.outputs.exists == 'true'
        working-directory: ./client
        run: npm run lint

      - name: Run tests
        if: steps.check_client.outputs.exists == 'true'
        working-directory: ./client
        run: npm run test

      - name: Build
        if: steps.check_client.outputs.exists == 'true'
        working-directory: ./client
        run: npm run build

      - name: Skip message
        if: steps.check_client.outputs.exists == 'false'
        run: echo "Client directory not found, skipping TypeScript checks"
