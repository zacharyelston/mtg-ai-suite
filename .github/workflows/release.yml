name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================
  # Build binaries for multiple platforms
  # ============================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mtg-ai-suite-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mtg-ai-suite-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mtg-ai-suite-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mtg-ai-suite-windows-x64
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mtg-server dist/ || true
          cp target/${{ matrix.target }}/release/mtg-ai-suite dist/ || true
          tar -czvf ${{ matrix.artifact }}.tar.gz -C dist .
          
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\mtg-server.exe dist\ 2>nul || echo "mtg-server not found"
          copy target\${{ matrix.target }}\release\mtg-ai-suite.exe dist\ 2>nul || echo "mtg-ai-suite not found"
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  # ============================================
  # Build WASM package
  # ============================================
  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          
      - name: Install wasm-pack
        run: cargo install wasm-pack
        
      - name: Build WASM
        run: wasm-pack build crates/mtg-wasm --target web --release
        
      - name: Package WASM
        run: |
          cd crates/mtg-wasm
          tar -czvf ../../mtg-wasm-pkg.tar.gz pkg/
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtg-wasm-pkg
          path: mtg-wasm-pkg.tar.gz

  # ============================================
  # Build Docker image
  # ============================================
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, wasm, docker]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: List artifacts
        run: find artifacts -type f
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
