[workspace]
resolver = "2"
members = [
    # Framework crates (game-agnostic)
    "crates/cardgame-core",

    # Game implementations
    "crates/games/mtg",
    "crates/games/template",

    # MTG-specific binaries (uses framework + mtg game)
    "crates/mtg-core",
    "crates/mtg-server",
    "crates/mtg-cli",
    "crates/mtg-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zacharyelston/mtg-ai-suite"
authors = ["MTG AI Suite Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Image processing
image = "0.24"
imageproc = "0.23"

# OCR
# leptess = "0.14"  # Tesseract bindings - uncomment when needed

# Fuzzy matching
strsim = "0.11"
# symspell = "0.4"  # Alternative fuzzy matching

# UUID
uuid = { version = "1.6", features = ["v4", "serde", "js"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Password hashing
argon2 = "0.5"

# Base64
base64 = "0.21"

# Testing
tokio-test = "0.4"
wiremock = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
