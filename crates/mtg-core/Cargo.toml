[package]
name = "mtg-core"
description = "Core library for MTG AI Suite - shared types and algorithms"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
strsim = { workspace = true }
tracing = { workspace = true }

# Optional dependencies for non-WASM builds
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
image = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = { workspace = true }

[features]
default = ["full"]
full = ["uuid", "chrono", "image", "base64"]  # All features for server/CLI
wasm = []  # Minimal feature set for WASM builds
