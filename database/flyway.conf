# Flyway Configuration for MTG AI Suite
# https://flywaydb.org/documentation/configuration/configfile

# Database connection (override with environment variables)
flyway.url=${FLYWAY_URL:-jdbc:postgresql://localhost:5432/mtg_ai_suite}
flyway.user=${FLYWAY_USER:-postgres}
flyway.password=${FLYWAY_PASSWORD:-}

# Migration locations
flyway.locations=filesystem:./migrations

# Schema
flyway.schemas=public

# Baseline (for existing databases)
flyway.baselineOnMigrate=true
flyway.baselineVersion=0

# Validation
flyway.validateOnMigrate=true

# Placeholders
flyway.placeholderReplacement=true
