version: '3.8'

services:
  # ============================================
  # Database Migrations (Flyway)
  # ============================================
  flyway:
    image: flyway/flyway:10
    command: migrate
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/mtg_ai_suite
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - ../database/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  # ============================================
  # MTG AI Suite Server
  # ============================================
  mtg-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/mtg_ai_suite
      - REDIS_URL=redis://redis:6379
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - RUST_LOG=info
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - captures:/app/data/captures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # PostgreSQL with pgvector
  # ============================================
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: mtg_ai_suite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  captures:
